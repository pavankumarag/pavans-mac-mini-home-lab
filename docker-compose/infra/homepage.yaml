services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage

    restart: unless-stopped

    ports:
      - "3002:3002"

    environment:
      TZ: Asia/Kolkata

    volumes:
      - ~/Homelab/data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
